name: water-watch

on:
  workflow_dispatch:
  schedule:
    # รายงานประจำวัน 07:00 น. ไทย = 00:00 UTC
    - cron: "0 0 * * *"
    # ตรวจแจ้งเตือนทุก 3 ชั่วโมง (ลดเป็น */6 ถ้าอยากประหยัด operations ของ Make)
    - cron: "0 */3 * * *"

permissions:
  contents: read

jobs:
  daily-report:
    name: Daily AI Water Report
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 * * *'

    env:
      TZ: Asia/Bangkok
      SAFE_MODE: "true"
      # สำคัญ: ต้องเป็น false ถึงจะส่งเข้า Make จริง (ค่าตั้งต้นในโค้ดคือ true = ไม่ส่ง)
      DRY_RUN: "false"

      IMAGE_HOST: ${{ secrets.IMAGE_HOST }}
      IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
      MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ติดตั้งฟอนต์ไทย + cairo เพื่อให้รูป PNG มีตัวอักษรไทย (ไม่เป็นกล่อง)
      - name: Install Thai fonts and cairo
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-thai-tlwg libcairo2 libcairo2-dev
          fc-cache -f

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # สำคัญ: ต้องมี --post ถึงจะยิง webhook เข้า Make (ไม่งั้นแค่สร้างรูปแล้วจบ)
      - name: Run daily report and post
        run: python main.py --post

  alert-watch:
    name: Flood Alert Watch
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */3 * * *'

    env:
      TZ: Asia/Bangkok
      SAFE_MODE: "true"
      DRY_RUN: "false"

      IMAGE_HOST: ${{ secrets.IMAGE_HOST }}
      IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
      MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Thai fonts and cairo
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-thai-tlwg libcairo2 libcairo2-dev
          fc-cache -f

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run alert watch and post
        run: python main.py --post
